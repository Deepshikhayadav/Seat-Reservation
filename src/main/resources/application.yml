spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${SPRING_DATASOURCE_USERNAME:reservation_user}
    password: ${SPRING_DATASOURCE_PASSWORD:reservation_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-at-least-32-characters-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    db:
      enabled: true

  metrics:
    tags:
      application: seat-reservation